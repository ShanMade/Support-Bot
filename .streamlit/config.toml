[theme]
# "Paper & ink": warm off-white canvas, cobalt accent, editorial type.
base = "light"
primaryColor = "#1e5eff"
backgroundColor = "#fbfaf8"
secondaryBackgroundColor = "#f3f1ea"
textColor = "#14161a"
linkColor = "#1e5eff"
borderColor = "#e3dfd4"
baseRadius = "14px"
buttonRadius = "10px"
showWidgetBorder = true
baseFontSize = 15
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFont = "'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif"
headingFontWeights = 600
codeFont = "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"

[server]
headless = true
maxUploadSize = 250

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "full"
