[project]
name = "voicenote-ai"
version = "1.0.0"
description = "VoiceNote AI - speaker-aware voice notes (Streamlit + Gemini + Groq Whisper)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
